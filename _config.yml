# Everything Review — Jekyll + Chirpy
# Built and deployed with GitHub Pages Actions

theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kuala_Lumpur

title: Everything Review
tagline: Honest reviews of the things I spend time and money on
description: >-
  A personal, conversational review blog covering games, gadgets, movies, TV,
  software, travel, fashion, food, places, sports, music, and books.

url: "https://jackrevieweverything.github.io"
baseurl: ""

github:
  username: jackrevieweverything

social:
  name: Everything Review
  email:
  links:
    - https://github.com/jackrevieweverything

theme_mode: dark
avatar: https://github.com/jackrevieweverything.png

toc: true

actions:
  edit_post:
    enabled: true
    url: "https://github.com/jackrevieweverything/jackrevieweverything.github.io/edit/main"
    static_url: false

comments:
  provider:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
